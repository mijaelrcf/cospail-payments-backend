openapi: 3.0.3
info:
  title: COSPAIL Payments API
  version: 1.0.0
  description: |
    API HTTP que integra las consultas y el registro de cobros del servicio SOAP de COSPAIL
    con la generación y notificación de pagos QR de Banco Económico.
servers:
  - url: https://{host}
    description: Servidor desplegado
    variables:
      host:
        default: localhost:5001
tags:
  - name: Banco Económico
  - name: COSPAIL SOAP
  - name: Notificaciones QR
paths:
  /api/BancoEconomico/authenticate:
    post:
      tags: [Banco Económico]
      summary: Autentica la integración con Banco Económico
      description: Las credenciales se obtienen de la configuración del servidor; el consumidor no envía cuerpo.
      operationId: authenticateBancoEconomico
      responses:
        '200':
          description: Token de Banco Económico obtenido correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateResponse'
              example:
                token: eyJhbGciOiJIUzI1NiJ9.example
                responseCode: 0
                message: ''
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/BancoEconomico/generate-qr:
    post:
      tags: [Banco Económico]
      summary: Genera un código QR de cobro
      description: El API autentica internamente ante Banco Económico. `accountCredit` se reemplaza por la cuenta configurada en el servidor.
      operationId: generateQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateQrRequest'
            example:
              transactionId: COB-20260711-0001
              accountCredit: valor-ignorado-por-el-servidor
              currency: BOB
              amount: 125.50
              description: Pago de servicio de agua - socio 12345
              dueDate: '2026-07-31'
              singleUse: true
              modifyAmount: false
              branchCode: '001'
      responses:
        '200':
          description: QR generado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateQrResponse'
              example:
                qrId: 7e538ea0-563a-4b71-89f0-065d9c548728
                qrImage: iVBORw0KGgoAAAANSUhEUgAA...
                responseCode: 0
                message: ''
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/CospailSoap/debt/{fixedCode}:
    get:
      tags: [COSPAIL SOAP]
      summary: Consulta la deuda por código fijo
      operationId: getDebt
      parameters:
        - $ref: '#/components/parameters/FixedCodePath'
      responses:
        '200':
          description: Deuda devuelta por COSPAIL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CospailDebtResponse'
              example:
                fixedCode: 12345
                noticeNumber: 44321
                creditNumber: 789
                type: 1
                year: 2026
                month: 7
                customerName: Juan Pérez
                period: JULIO/2026
                amount: 125.50
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/CospailSoap/member-debt-by-document:
    get:
      tags: [COSPAIL SOAP]
      summary: Consulta deudas por código fijo y documento
      operationId: getMemberDebtByDocument
      parameters:
        - $ref: '#/components/parameters/FixedCodeQuery'
        - name: documentId
          in: query
          required: true
          description: Documento de identidad o NIT del socio.
          schema:
            type: string
            minLength: 1
          example: '1234567'
      responses:
        '200':
          description: Estado del socio y sus deudas pendientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMemberDebtByDocumentResponse'
              example:
                fixedCode: 12345
                documentId: '1234567'
                memberName: Juan Pérez
                status: HasDebt
                debts:
                  - noticeNumber: 44321
                    creditNumber: 789
                    type: 1
                    year: 2026
                    month: 7
                    memberName: Juan Pérez
                    period: JULIO/2026
                    amount: 125.50
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/CospailSoap/payments/confirm:
    post:
      tags: [COSPAIL SOAP]
      summary: Valida y registra el pago de una deuda en COSPAIL
      operationId: confirmPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
            example:
              fixedCode: 12345
              documentId: '1234567'
              creditNumber: 789
              type: 1
              amount: 125.50
      responses:
        '200':
          description: Resultado del registro de pago en COSPAIL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmPaymentResponse'
              example:
                success: true
                message: Cobro registrado correctamente
                fixedCode: 12345
                documentId: '1234567'
                creditNumber: 789
                type: 1
                amount: 125.50
                memberName: Juan Pérez
                rawCospailResult: OK
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/qrsimple/notifyPaymentQR:
    post:
      tags: [Notificaciones QR]
      summary: Recibe la notificación de pago QR de Banco Económico
      description: |
        Callback destinado a Banco Económico. Por diseño actual siempre responde HTTP 200;
        los errores de validación o procesamiento se comunican con `responseCode` 1 o 99.
      operationId: notifyPaymentQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifyPaymentQrRequest'
            example:
              payment:
                qrId: 7e538ea0-563a-4b71-89f0-065d9c548728
                transactionId: COB-20260711-0001
                paymentDate: '2026-07-11'
                paymentTime: '14:35:12'
                currency: BOB
                amount: 125.50
                senderBankCode: '001'
                senderName: Juan Pérez
                senderDocumentId: '1234567'
                senderAccount: '1000000123456'
                description: Pago de servicio de agua
                branchCode: '001'
      responses:
        '200':
          description: Acuse de recepción. `responseCode` 0 indica aceptación, 1 error de validación y 99 error de procesamiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyPaymentQrResponse'
              examples:
                accepted:
                  value: { responseCode: 0, message: '' }
                invalid:
                  value: { responseCode: 1, message: 'payment.currency debe ser BOB o USD.' }
                processingError:
                  value: { responseCode: 99, message: 'Ocurrió un error procesando la notificación.' }
components:
  parameters:
    FixedCodePath:
      name: fixedCode
      in: path
      required: true
      description: Código fijo del socio.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 12345
    FixedCodeQuery:
      name: fixedCode
      in: query
      required: true
      description: Código fijo del socio.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 12345
  responses:
    ValidationError:
      description: Parámetros o datos inválidos.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: about:blank
            title: Validation Error
            status: 400
            detail: fixedCode debe ser mayor a cero.
            instance: /api/CospailSoap/member-debt-by-document
    NotFound:
      description: Recurso no encontrado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Recurso no encontrado.
            instance: /api/CospailSoap/debt/12345
    InternalServerError:
      description: Error no controlado o error al consumir un servicio externo.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred.
            instance: /api/BancoEconomico/generate-qr
  schemas:
    AuthenticateResponse:
      type: object
      required: [token, responseCode, message]
      properties:
        token: { type: string, description: Token Bearer emitido por Banco Económico. }
        responseCode: { type: integer, format: int32, description: Código funcional del banco; 0 es éxito. }
        message: { type: string }
    GenerateQrRequest:
      type: object
      required: [transactionId, accountCredit, currency, amount, dueDate, singleUse, modifyAmount]
      properties:
        transactionId: { type: string, minLength: 1 }
        accountCredit: { type: string, description: Se sobrescribe con la cuenta configurada en el servidor. }
        currency: { type: string, default: BOB, enum: [BOB, USD] }
        amount: { type: number, format: decimal, minimum: 0, exclusiveMinimum: true }
        description: { type: string, nullable: true }
        dueDate: { type: string, description: Fecha de vencimiento en el formato requerido por Banco Económico. }
        singleUse: { type: boolean, default: true }
        modifyAmount: { type: boolean, default: false }
        branchCode: { type: string, nullable: true }
    GenerateQrResponse:
      type: object
      required: [responseCode]
      properties:
        qrId: { type: string, nullable: true }
        qrImage: { type: string, nullable: true, description: Imagen QR devuelta por el banco, normalmente codificada en Base64. }
        responseCode: { type: integer, format: int32 }
        message: { type: string, nullable: true }
    CospailDebtResponse:
      type: object
      required: [fixedCode, customerName, period]
      properties:
        fixedCode: { type: integer, format: int32 }
        noticeNumber: { type: integer, format: int32, nullable: true }
        creditNumber: { type: integer, format: int32, nullable: true }
        type: { type: integer, format: int32, nullable: true }
        year: { type: integer, format: int32, nullable: true }
        month: { type: integer, format: int32, nullable: true }
        customerName: { type: string }
        period: { type: string }
        amount: { type: number, format: decimal, nullable: true }
    GetMemberDebtByDocumentResponse:
      type: object
      required: [fixedCode, documentId, status, debts]
      properties:
        fixedCode: { type: integer, format: int32 }
        documentId: { type: string }
        memberName: { type: string, nullable: true }
        status: { type: string, enum: [HasDebt, NoDebt, DocumentMismatch, MemberNotFound] }
        debts:
          type: array
          items: { $ref: '#/components/schemas/DebtItem' }
    DebtItem:
      type: object
      required: [noticeNumber, creditNumber, type, year, month, memberName, period, amount]
      properties:
        noticeNumber: { type: integer, format: int32 }
        creditNumber: { type: integer, format: int32 }
        type: { type: integer, format: int32 }
        year: { type: integer, format: int32 }
        month: { type: integer, format: int32 }
        memberName: { type: string }
        period: { type: string }
        amount: { type: number, format: decimal }
    ConfirmPaymentRequest:
      type: object
      required: [fixedCode, documentId, creditNumber, type, amount]
      properties:
        fixedCode: { type: integer, format: int32, minimum: 1 }
        documentId: { type: string, minLength: 1 }
        creditNumber: { type: integer, format: int32 }
        type: { type: integer, format: int32 }
        amount: { type: number, format: decimal, minimum: 0, exclusiveMinimum: true }
    ConfirmPaymentResponse:
      type: object
      required: [success, message, fixedCode, documentId, creditNumber, type, amount, rawCospailResult]
      properties:
        success: { type: boolean }
        message: { type: string }
        fixedCode: { type: integer, format: int32 }
        documentId: { type: string }
        creditNumber: { type: integer, format: int32 }
        type: { type: integer, format: int32 }
        amount: { type: number, format: decimal }
        memberName: { type: string, nullable: true }
        rawCospailResult: { type: string, description: Respuesta cruda de COSPAIL. }
    NotifyPaymentQrRequest:
      type: object
      required: [payment]
      properties:
        payment: { $ref: '#/components/schemas/QrPayment' }
    QrPayment:
      type: object
      required: [qrId, transactionId, paymentDate, paymentTime, currency, amount, senderBankCode, senderName, senderAccount, description, branchCode]
      properties:
        qrId: { type: string, minLength: 1 }
        transactionId: { type: string, minLength: 1 }
        paymentDate: { type: string, format: date }
        paymentTime: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d$' }
        currency: { type: string, enum: [BOB, USD] }
        amount: { type: number, format: decimal, minimum: 0, exclusiveMinimum: true }
        senderBankCode: { type: string, minLength: 1 }
        senderName: { type: string, minLength: 1 }
        senderDocumentId: { type: string, description: No es validado por la implementación actual. }
        senderAccount: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        branchCode: { type: string, minLength: 1 }
    NotifyPaymentQrResponse:
      type: object
      required: [responseCode, message]
      properties:
        responseCode: { type: integer, format: int32, enum: [0, 1, 99] }
        message: { type: string }
    ProblemDetails:
      type: object
      properties:
        type: { type: string, format: uri, nullable: true }
        title: { type: string, nullable: true }
        status: { type: integer, format: int32, nullable: true }
        detail: { type: string, nullable: true }
        instance: { type: string, nullable: true }
